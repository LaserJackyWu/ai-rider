name: Test Taiwan IPTV candidates

on:
  push:
    branches: [tubo-playlist]
    paths:
      - .github/workflows/tubo-taiwan-relaxed-test.yml

permissions:
  contents: write

jobs:
  test-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tubo-playlist

      - name: Confirm ffmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Fetch, filter and test Taiwan streams
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          import re
          import subprocess
          import time
          import urllib.request
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from dataclasses import dataclass
          from pathlib import Path
          from urllib.parse import urlsplit

          SOURCES = [
              ("wangzi-mirror", "https://raw.githubusercontent.com/wujiangliu/live-sources/refs/heads/main/wangzizb.txt"),
              ("iptv-org-tw", "https://iptv-org.github.io/iptv/countries/tw.m3u"),
              ("cs3306", "https://raw.githubusercontent.com/cs3306/IPTV-Sources/main/data/output/iptv_collection.m3u"),
              ("free-tv", "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_taiwan.m3u8"),
          ]

          # Used only for mixed/global lists. The two Taiwan-specific lists are accepted by source identity.
          TW_NAME_MARKERS = [
              "公視", "公视", "民視", "民视", "台視", "台视", "中視", "中视", "華視", "华视",
              "三立", "東森", "东森", "中天", "tvbs", "壹新聞", "壹新闻", "壹電視", "壹电视",
              "年代", "非凡", "寰宇", "鏡新聞", "镜新闻", "八大", "緯來", "纬来", "博斯",
              "愛爾達", "爱尔达", "靖天", "靖洋", "龍華", "龙华", "momo tv", "大愛", "大爱",
              "原住民", "原視", "原视", "客家", "唯心", "大立", "新唐人", "美好生活",
              "good tv", "好消息", "幸福空間", "幸福空间", "霹靂", "霹雳", "台灣戲劇", "台湾戏剧",
              "jet綜合", "jet综合", "taiwanplus", "taiwan indigenous", "tvbs asia", "axn asia taiwan",
              "衛視中文", "卫视中文", "國家地理", "国家地理", "discovery", "cinemax", "hbo",
              "star movies", "animax", "cartoon network", "東風", "东风", "超視", "超视"
          ]

          ADULT_BLOCK = [
              "成人", "18禁", "情色", "色情", "松視", "松视", "潘朵啦", "潘朵拉", "香蕉台",
              "playboy", "hustler", "redlight", "brazzers", "xxx", "porn", "av頻道", "av频道"
          ]

          MAX_CHANNELS = 220
          MAX_URLS_PER_CHANNEL = 5
          ROUNDS = 3
          REQUIRED_PASSES = 2
          WORKERS = 20

          @dataclass(frozen=True)
          class Candidate:
              name: str
              url: str
              group: str
              source: str

          def fetch_text(url):
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15",
                  "Accept": "*/*",
              })
              with urllib.request.urlopen(req, timeout=35) as r:
                  raw = r.read()
              for enc in ("utf-8-sig", "utf-8", "gb18030", "big5"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("utf-8", errors="replace")

          def clean_name(name):
              name = re.sub(r"\[[^\]]*\]", "", name)
              name = re.sub(r"\([^)]*(?:geo|not 24|\d{3,4}p|sd|hd|fhd|uhd)[^)]*\)", "", name, flags=re.I)
              return re.sub(r"\s+", " ", name).strip(" ,|-_")

          def key_name(name):
              s = clean_name(name).lower()
              for a, b in (("臺", "台"), ("視", "视"), ("華", "华"), ("東", "东")):
                  s = s.replace(a, b)
              return re.sub(r"[^0-9a-z\u4e00-\u9fff]+", "", s)

          def blocked(c):
              text = f"{c.name} {c.group}".lower()
              return any(x.lower() in text for x in ADULT_BLOCK)

          def looks_taiwan(c):
              if c.source in {"iptv-org-tw", "free-tv"}:
                  return True
              group = c.group.lower()
              name = c.name.lower()
              if c.source == "cs3306" and ("台湾" in group or "台灣" in group):
                  return True
              return any(x.lower() in name for x in TW_NAME_MARKERS)

          def extract_urls(text):
              # Supports url1#url2 and comma-separated alternates.
              starts = [m.start() for m in re.finditer(r"https?://", text, flags=re.I)]
              urls = []
              for i, start in enumerate(starts):
                  end = starts[i + 1] if i + 1 < len(starts) else len(text)
                  raw = text[start:end].rstrip("# ,;\t")
                  raw = raw.split(",", 1)[0].rstrip("# ,;\t")
                  if raw:
                      urls.append(raw)
              return urls

          def parse_source(source, text):
              out = []
              current_group = ""
              pending_name = ""
              pending_group = ""
              for line in (x.strip() for x in text.replace("\r", "").split("\n")):
                  if not line:
                      continue
                  if line.startswith("#EXTINF"):
                      pending_name = clean_name(line.rsplit(",", 1)[-1])
                      gm = re.search(r'group-title="([^"]*)"', line, flags=re.I)
                      pending_group = gm.group(1).strip() if gm else current_group
                      continue
                  if line.startswith("#EXTBURL:") and pending_name:
                      for url in extract_urls(line[len("#EXTBURL:"):]):
                          out.append(Candidate(pending_name, url, pending_group, source))
                      continue
                  if pending_name and re.match(r"https?://", line, flags=re.I):
                      for url in extract_urls(line):
                          out.append(Candidate(pending_name, url, pending_group, source))
                      pending_name = ""
                      pending_group = ""
                      continue
                  if line.startswith("#"):
                      continue
                  if ",#genre#" in line.lower():
                      current_group = line.split(",", 1)[0].strip()
                      continue
                  if "," in line:
                      name, rhs = line.split(",", 1)
                      for url in extract_urls(rhs):
                          out.append(Candidate(clean_name(name), url, current_group, source))
              return out

          all_candidates = []
          source_errors = []
          for source, url in SOURCES:
              try:
                  text = fetch_text(url)
                  parsed = parse_source(source, text)
                  all_candidates.extend(parsed)
                  print(f"FETCH {source}: {len(parsed)} entries")
              except Exception as e:
                  source_errors.append({"source": source, "url": url, "error": repr(e)})
                  print(f"SOURCE ERROR {source}: {e}")

          source_priority = {"iptv-org-tw": 0, "free-tv": 1, "cs3306": 2, "wangzi-mirror": 3}
          grouped = defaultdict(list)
          seen_pairs = set()

          for c in all_candidates:
              if not c.name or not c.url or blocked(c) or not looks_taiwan(c):
                  continue
              if not c.url.lower().startswith(("http://", "https://")):
                  continue
              host = (urlsplit(c.url).hostname or "").lower()
              if not host or host in {"localhost", "127.0.0.1"} or host.startswith(("10.", "192.168.")):
                  continue
              k = key_name(c.name)
              pair = (k, c.url)
              if not k or pair in seen_pairs:
                  continue
              seen_pairs.add(pair)
              grouped[k].append(c)

          selected = []
          channel_items = sorted(grouped.items(), key=lambda kv: (
              min(source_priority.get(c.source, 9) for c in kv[1]), kv[0]
          ))[:MAX_CHANNELS]

          for _, items in channel_items:
              items = sorted(items, key=lambda c: (source_priority.get(c.source, 9), len(c.url)))
              chosen = []
              hosts = set()
              # Prefer distinct relay/CDN hosts so a dead first relay does not hide a working alternate.
              for c in items:
                  host = (urlsplit(c.url).hostname or "").lower()
                  if host not in hosts:
                      chosen.append(c)
                      hosts.add(host)
                  if len(chosen) >= MAX_URLS_PER_CHANNEL:
                      break
              if len(chosen) < MAX_URLS_PER_CHANNEL:
                  for c in items:
                      if c not in chosen:
                          chosen.append(c)
                      if len(chosen) >= MAX_URLS_PER_CHANNEL:
                          break
              selected.extend(chosen)

          print(f"TESTING {len(selected)} URLs / {len(channel_items)} channel names")

          def probe(c):
              ua = "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)"
              started = time.monotonic()
              probe_cmd = [
                  "timeout", "32s", "ffprobe", "-v", "error", "-rw_timeout", "24000000",
                  "-user_agent", ua, "-show_entries", "stream=codec_type", "-of", "csv=p=0", c.url
              ]
              try:
                  p = subprocess.run(probe_cmd, capture_output=True, text=True)
                  if p.returncode != 0 or "video" not in (p.stdout or "").lower():
                      return False, round(time.monotonic() - started, 2), (p.stderr or "")[-500:].replace("\n", " | ")
                  play_cmd = [
                      "timeout", "40s", "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error",
                      "-rw_timeout", "24000000", "-reconnect", "1", "-reconnect_streamed", "1",
                      "-reconnect_delay_max", "2", "-user_agent", ua, "-analyzeduration", "10000000",
                      "-probesize", "10000000", "-i", c.url, "-t", "6", "-map", "0:v:0", "-an", "-f", "null", "-"
                  ]
                  p2 = subprocess.run(play_cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                  return p2.returncode == 0, round(time.monotonic() - started, 2), (p2.stderr or "")[-500:].replace("\n", " | ")
              except Exception as e:
                  return False, round(time.monotonic() - started, 2), repr(e)

          stats = {(c.name, c.url, c.group, c.source): {
              "candidate": c, "passes": 0, "times": [], "errors": []
          } for c in selected}

          for round_no in range(1, ROUNDS + 1):
              print(f"ROUND {round_no}/{ROUNDS}")
              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  futures = {pool.submit(probe, c): c for c in selected}
                  for fut in as_completed(futures):
                      c = futures[fut]
                      ok, elapsed, error = fut.result()
                      row = stats[(c.name, c.url, c.group, c.source)]
                      row["passes"] += int(ok)
                      row["times"].append(elapsed)
                      if not ok:
                          row["errors"].append(error)
                      print(f"{'PASS' if ok else 'FAIL'} {elapsed:>5}s | {c.name} | {c.source}")
              if round_no < ROUNDS:
                  time.sleep(15)

          by_channel = defaultdict(list)
          for row in stats.values():
              by_channel[key_name(row["candidate"].name)].append(row)

          winners = []
          for rows in by_channel.values():
              passing = [r for r in rows if r["passes"] >= REQUIRED_PASSES]
              if not passing:
                  continue
              passing.sort(key=lambda r: (
                  -r["passes"],
                  sum(r["times"]) / len(r["times"]),
                  source_priority.get(r["candidate"].source, 9),
              ))
              winners.append(passing[0])

          def output_group(c):
              if c.source == "wangzi-mirror":
                  return "台灣｜候補中繼"
              if c.source == "cs3306":
                  return "台灣｜聚合來源"
              if c.group and ("台湾" in c.group or "台灣" in c.group):
                  return c.group
              return "台灣｜公開來源"

          winners.sort(key=lambda r: (output_group(r["candidate"]), r["candidate"].name))
          out = Path("tubo")
          out.mkdir(exist_ok=True)
          m3u_path = out / "taiwan_relaxed_verified.m3u"
          csv_path = out / "taiwan_relaxed_test_report.csv"
          errors_path = out / "taiwan_source_errors.json"
          timestamp = time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime())

          with m3u_path.open("w", encoding="utf-8", newline="\n") as f:
              f.write("#EXTM3U\n")
              f.write(f"#PLAYLIST:途播｜台灣頻道寬鬆驗證版｜{timestamp}\n")
              f.write(f"#NOTE:3 輪實際影像讀流測試，每輪約 6 秒；至少通過 2 輪才收錄。成人來源未收錄。\n\n")
              for r in winners:
                  c = r["candidate"]
                  avg = sum(r["times"]) / len(r["times"])
                  group = output_group(c).replace('"', "")
                  name = c.name.replace('"', "")
                  f.write(f'#EXTINF:-1 group-title="{group}",{name} [{r["passes"]}/{ROUNDS}｜啟動{avg:.1f}s]\n')
                  f.write("#EXTVLCOPT:http-user-agent=Mozilla/5.0\n")
                  f.write(c.url + "\n")

          winner_urls = {r["candidate"].url for r in winners}
          with csv_path.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["selected", "name", "output_group", "original_group", "source", "url", "passes", "rounds", "avg_seconds", "last_error"])
              for r in sorted(stats.values(), key=lambda x: (x["candidate"].name, -x["passes"], x["candidate"].url)):
                  c = r["candidate"]
                  avg = sum(r["times"]) / len(r["times"])
                  w.writerow(["yes" if c.url in winner_urls else "no", c.name, output_group(c), c.group, c.source,
                              c.url, r["passes"], ROUNDS, f"{avg:.2f}", r["errors"][-1] if r["errors"] else ""])

          errors_path.write_text(json.dumps(source_errors, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"ACCEPTED {len(winners)} Taiwan channels")
          print(m3u_path.read_text(encoding="utf-8")[:8000])
          PY

      - name: Commit verified playlist and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tubo/taiwan_relaxed_verified.m3u tubo/taiwan_relaxed_test_report.csv tubo/taiwan_source_errors.json
          git commit -m "Update corrected Taiwan IPTV test results" || exit 0
          git push origin HEAD:tubo-playlist
