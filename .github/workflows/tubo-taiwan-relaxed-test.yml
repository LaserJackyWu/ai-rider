name: Test Taiwan IPTV candidates

on:
  push:
    branches: [tubo-playlist]
    paths:
      - .github/workflows/tubo-taiwan-relaxed-test.yml

permissions:
  contents: write

jobs:
  test-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: tubo-playlist

      - name: Confirm ffmpeg tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Fetch, filter and test Taiwan streams
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.request
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from dataclasses import dataclass
          from pathlib import Path
          from urllib.parse import urlsplit

          SOURCES = [
              ("wangzi-mirror", "https://raw.githubusercontent.com/wujiangliu/live-sources/refs/heads/main/wangzizb.txt"),
              ("iptv-org-tw", "https://iptv-org.github.io/iptv/countries/tw.m3u"),
              ("cs3306", "https://raw.githubusercontent.com/cs3306/IPTV-Sources/main/data/output/iptv_collection.m3u"),
              ("free-tv", "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlists/playlist_taiwan.m3u8"),
          ]

          TW_KEYWORDS = [
              "台視", "台视", "中視", "中视", "華視", "华视", "民視", "民视", "公視", "公视",
              "客家", "原住民", "原視", "原视", "taiwanplus", "大愛", "大爱", "唯心", "新唐人",
              "三立", "tvbs", "東森", "东森", "中天", "壹新聞", "壹电视", "壹電視", "年代",
              "非凡", "鏡新聞", "镜新闻", "momo", "八大", "緯來", "纬来", "博斯", "愛爾達",
              "爱尔达", "靖天", "龍華", "龙华", "衛視中文", "卫视中文", "東風", "东风",
              "好消息", "good tv", "大立", "寰宇", "ustv", "set news", "ftv", "ttv", "ctv",
              "cts", "pts", "ebc", "cti", "formosa", "taiwan", "台灣", "台湾", "港台"
          ]

          ADULT_BLOCK = [
              "成人", "18禁", "情色", "色情", "松視", "松视", "潘朵啦", "潘朵拉", "彩虹", "香蕉台",
              "playboy", "hustler", "redlight", "brazzers", "xxx", "porn", "av頻道", "av频道"
          ]

          UNSUPPORTED_SCHEMES = ("udp://", "rtp://", "rtmp://", "rtsp://")
          MAX_CHANNELS = 130
          MAX_URLS_PER_CHANNEL = 3
          ROUNDS = 3
          REQUIRED_PASSES = 2
          WORKERS = 18

          @dataclass(frozen=True)
          class Candidate:
              name: str
              url: str
              group: str
              source: str

          def fetch_text(url: str) -> str:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15",
                      "Accept": "*/*",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
              for enc in ("utf-8-sig", "utf-8", "gb18030", "big5"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              return raw.decode("utf-8", errors="replace")

          def clean_name(name: str) -> str:
              name = re.sub(r"\[[^\]]*\]", "", name)
              name = re.sub(r"\([^)]*(?:p|fps|geo|not 24|sd|hd|fhd|uhd)[^)]*\)", "", name, flags=re.I)
              return re.sub(r"\s+", " ", name).strip(" ,|-_")

          def key_name(name: str) -> str:
              s = clean_name(name).lower()
              s = s.replace("臺", "台").replace("視", "视").replace("華", "华").replace("東", "东")
              s = re.sub(r"[^0-9a-z\u4e00-\u9fff]+", "", s)
              return s

          def looks_taiwan(name: str, group: str) -> bool:
              text = f"{name} {group}".lower()
              return any(k.lower() in text for k in TW_KEYWORDS)

          def blocked(name: str, group: str) -> bool:
              text = f"{name} {group}".lower()
              return any(k.lower() in text for k in ADULT_BLOCK)

          def extract_urls(text: str):
              # Split chained alternatives such as url1#url2 while preserving ordinary query strings.
              return re.findall(r"https?://[^\s,]+?(?=(?:#https?://)|$)", text)

          def parse_source(source: str, text: str):
              lines = [ln.strip() for ln in text.replace("\r", "").split("\n")]
              out = []
              current_group = ""
              pending_name = ""
              pending_group = ""

              for line in lines:
                  if not line:
                      continue
                  if line.startswith("#EXTINF"):
                      pending_name = line.rsplit(",", 1)[-1].strip()
                      gm = re.search(r'group-title="([^"]*)"', line, flags=re.I)
                      pending_group = gm.group(1).strip() if gm else current_group
                      continue
                  if line.startswith("#EXTBURL:") and pending_name:
                      for url in extract_urls(line[len("#EXTBURL:"):]):
                          out.append(Candidate(clean_name(pending_name), url, pending_group, source))
                      continue
                  if pending_name and re.match(r"https?://", line, flags=re.I):
                      for url in extract_urls(line):
                          out.append(Candidate(clean_name(pending_name), url, pending_group, source))
                      pending_name = ""
                      pending_group = ""
                      continue
                  if line.startswith("#"):
                      continue
                  if ",#genre#" in line.lower():
                      current_group = line.split(",", 1)[0].strip()
                      continue
                  if "," in line:
                      name, rhs = line.split(",", 1)
                      urls = extract_urls(rhs)
                      for url in urls:
                          out.append(Candidate(clean_name(name), url, current_group, source))
              return out

          all_candidates = []
          source_errors = []
          for source, url in SOURCES:
              try:
                  text = fetch_text(url)
                  parsed = parse_source(source, text)
                  all_candidates.extend(parsed)
                  print(f"Fetched {source}: {len(text):,} chars, {len(parsed):,} parsed entries")
              except Exception as e:
                  source_errors.append((source, url, repr(e)))
                  print(f"SOURCE ERROR {source}: {e}")

          grouped = defaultdict(list)
          seen_pairs = set()
          source_priority = {"iptv-org-tw": 0, "free-tv": 1, "cs3306": 2, "wangzi-mirror": 3}

          for c in all_candidates:
              if not c.name or not c.url:
                  continue
              if blocked(c.name, c.group) or not looks_taiwan(c.name, c.group):
                  continue
              if c.url.lower().startswith(UNSUPPORTED_SCHEMES):
                  continue
              if not c.url.lower().startswith(("http://", "https://")):
                  continue
              host = (urlsplit(c.url).hostname or "").lower()
              if host in {"127.0.0.1", "localhost"} or host.startswith(("192.168.", "10.")):
                  continue
              k = key_name(c.name)
              pair = (k, c.url)
              if not k or pair in seen_pairs:
                  continue
              seen_pairs.add(pair)
              grouped[k].append(c)

          # Keep the most relevant candidates and a few alternate URLs per channel.
          selected = []
          channel_items = sorted(
              grouped.items(),
              key=lambda kv: (min(source_priority.get(c.source, 9) for c in kv[1]), kv[0]),
          )[:MAX_CHANNELS]
          for _, items in channel_items:
              items = sorted(items, key=lambda c: (source_priority.get(c.source, 9), len(c.url)))
              selected.extend(items[:MAX_URLS_PER_CHANNEL])

          print(f"Testing {len(selected)} URLs across {len(channel_items)} Taiwan channel names")

          def run_probe(c: Candidate):
              cmd = [
                  "timeout", "38s", "ffmpeg", "-nostdin", "-hide_banner", "-loglevel", "error",
                  "-rw_timeout", "22000000",
                  "-reconnect", "1", "-reconnect_streamed", "1", "-reconnect_delay_max", "2",
                  "-user_agent", "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)",
                  "-analyzeduration", "8000000", "-probesize", "8000000",
                  "-i", c.url, "-t", "6",
                  "-map", "0:v:0?", "-map", "0:a:0?", "-f", "null", "-"
              ]
              started = time.monotonic()
              try:
                  p = subprocess.run(cmd, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
                  elapsed = round(time.monotonic() - started, 2)
                  err = (p.stderr or "")[-600:].replace("\n", " | ")
                  return p.returncode == 0, elapsed, err
              except Exception as e:
                  return False, round(time.monotonic() - started, 2), repr(e)

          stats = {
              (c.name, c.url, c.group, c.source): {"candidate": c, "passes": 0, "times": [], "errors": []}
              for c in selected
          }

          for round_no in range(1, ROUNDS + 1):
              print(f"Round {round_no}/{ROUNDS}")
              with ThreadPoolExecutor(max_workers=WORKERS) as pool:
                  futures = {pool.submit(run_probe, c): c for c in selected}
                  for fut in as_completed(futures):
                      c = futures[fut]
                      ok, elapsed, err = fut.result()
                      s = stats[(c.name, c.url, c.group, c.source)]
                      s["passes"] += int(ok)
                      s["times"].append(elapsed)
                      if not ok:
                          s["errors"].append(err)
                      print(f"  {'PASS' if ok else 'FAIL'} {elapsed:>5}s | {c.name} | {c.source}")
              if round_no < ROUNDS:
                  time.sleep(15)

          by_channel = defaultdict(list)
          for s in stats.values():
              by_channel[key_name(s["candidate"].name)].append(s)

          winners = []
          for key, rows in by_channel.items():
              passing = [r for r in rows if r["passes"] >= REQUIRED_PASSES]
              if not passing:
                  continue
              passing.sort(key=lambda r: (
                  -r["passes"],
                  sum(r["times"]) / max(len(r["times"]), 1),
                  source_priority.get(r["candidate"].source, 9),
              ))
              winners.append(passing[0])

          winners.sort(key=lambda r: (r["candidate"].group or "台灣｜候補", r["candidate"].name))

          out_dir = Path("tubo")
          out_dir.mkdir(parents=True, exist_ok=True)
          m3u_path = out_dir / "taiwan_relaxed_verified.m3u"
          report_path = out_dir / "taiwan_relaxed_test_report.csv"
          error_path = out_dir / "taiwan_source_errors.json"

          timestamp = time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime())
          with m3u_path.open("w", encoding="utf-8", newline="\n") as f:
              f.write("#EXTM3U\n")
              f.write(f"#PLAYLIST:途播｜台灣頻道寬鬆驗證版｜{timestamp}\n")
              f.write(f"#NOTE:每個網址進行 {ROUNDS} 次、每次約 6 秒讀流測試；至少通過 {REQUIRED_PASSES} 次才收錄。\n\n")
              for r in winners:
                  c = r["candidate"]
                  group = c.group.strip() if c.group.strip() else "台灣｜候補"
                  avg = sum(r["times"]) / max(len(r["times"]), 1)
                  f.write(f'#EXTINF:-1 group-title="{group}",{c.name} [{r["passes"]}/{ROUNDS}｜{avg:.1f}s]\n')
                  f.write("#EXTVLCOPT:http-user-agent=Mozilla/5.0\n")
                  f.write(c.url + "\n")

          with report_path.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["selected", "name", "group", "source", "url", "passes", "rounds", "avg_seconds", "last_error"])
              winner_urls = {r["candidate"].url for r in winners}
              for r in sorted(stats.values(), key=lambda x: (x["candidate"].name, -x["passes"], x["candidate"].url)):
                  c = r["candidate"]
                  avg = sum(r["times"]) / max(len(r["times"]), 1)
                  w.writerow([
                      "yes" if c.url in winner_urls else "no", c.name, c.group, c.source, c.url,
                      r["passes"], ROUNDS, f"{avg:.2f}", r["errors"][-1] if r["errors"] else ""
                  ])

          error_path.write_text(json.dumps(source_errors, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Accepted {len(winners)} channels")
          print(m3u_path.read_text(encoding="utf-8")[:5000])
          PY

      - name: Commit verified playlist and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tubo/taiwan_relaxed_verified.m3u tubo/taiwan_relaxed_test_report.csv tubo/taiwan_source_errors.json
          git commit -m "Update relaxed Taiwan IPTV test results" || exit 0
          git push origin HEAD:tubo-playlist
