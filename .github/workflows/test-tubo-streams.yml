name: Test Taiwan public IPTV streams

on:
  push:
    branches:
      - tubo-playlist
    paths:
      - .github/workflows/test-tubo-streams.yml
      - tubo/test_streams.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out playlist branch
        uses: actions/checkout@v4
        with:
          ref: tubo-playlist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tester dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe manifests and media segments
        run: python tubo/test_streams.py

      - name: Commit tested playlist and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tubo/taiwan_public_60pct.m3u tubo/taiwan_test_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tested Taiwan public IPTV playlist"
            git push origin HEAD:tubo-playlist
          fi
